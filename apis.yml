name: Qventus
description: >-
  Qventus is a healthcare technology company that provides an AI-powered
  automation platform for hospital operations. Its "AI teammates" combine machine
  learning, generative AI, and behavioral science to streamline care-coordination
  workflows across surgical growth and operating-room utilization, perioperative
  and pre-admission-testing coordination, inpatient capacity and discharge
  planning, and care-gap and coding automation. Qventus sells to health systems
  and hospitals as a B2B SaaS product and does not currently publish a public
  developer API, developer portal, or SDKs; this profile is maintained in the API
  Evangelist network as a company record. It was surfaced as a portfolio company
  of Bessemer Venture Partners, Mayfield, Norwest Venture Partners, and Y
  Combinator.
